{% extends "layout.html" %}
{% block title %}BaseeraAI - Chatbot{% endblock %}
{% block content %}
<div class="chat-container">
    <div class="chat-area" id="chat-area">
        <div class="message-row ai">
            <div class="avatar ai"><i class="fas fa-robot"></i></div>
            <div class="message-bubble ai">
                <div class="ai-response-content">
                    <p>Assalamualaikum! How can I help you today?</p>
                </div>
            </div>
        </div>
        </div>
    
    <div class="input-container">
        <div class="prompt-suggestions-wrapper" id="prompt-suggestions-wrapper" style="display: none;">
            <summary>Prompt Suggestions</summary>
            <div class="prompt-suggestions" id="prompt-suggestions"></div>
        </div>
        
        <form class="input-form" id="chat-form">
            <textarea id="topicInput" rows="1" placeholder="Ask a question..."></textarea>
            <button id="askButton" type="submit" aria-label="Send"><i class="fas fa-arrow-up"></i></button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
